name: daily

on:
  schedule:
    # 13:20 UTC every day (~06:20 America/Los_Angeles)
    - cron: "20 13 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-book-health
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Regenerate dashboard
        run: python3 scripts/generate.py

      - name: Commit refreshed dashboard
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to commit."
          else
            AS_OF=$(python3 -c "import json;print(json.load(open('data/book.json'))['meta']['as_of'])")
            git commit -m "Daily book health refresh — ${AS_OF}"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "as_of=${AS_OF}" >> "$GITHUB_OUTPUT"
          fi

      - name: Open daily issue
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          AS_OF="${{ steps.commit.outputs.as_of }}"
          gh issue create \
            --title "Copilot Book Health — ${AS_OF}" \
            --body-file change-summary.md
